name: Sync Docs

on:
  push:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Send docs to BuddyAssist
        run: |
          CONTENT=$(sed ':a;N;$!ba;s/\n/ /g' README.md)
          curl -X POST https://docassist-tcylx.ondigitalocean.app/api/v1/documentation/69c8f39f4ec171758fb1e1dc/webhook-ingest \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.BUDDYASSIST_TOKEN }}" \
            -d "{\"documents\":[{\"title\":\"README\",\"content\":\"$CONTENT\",\"doc_type\":\"guide\"}]}"
